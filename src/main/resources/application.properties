spring.application.name=finia

server.port=8080

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.indent-output=true

logging.level.org.springframework.web=INFO

# A chave nunca deve ser colocada diretamente neste arquivo.
# Configure OPENAI_API_KEY no ambiente da aplicação.
openai.api-key=${OPENAI_API_KEY:}

# Modelo econômico por padrão. Pode ser alterado sem modificar o código.
openai.model=${OPENAI_MODEL:gpt-5-mini}

# Não truncar silenciosamente meses/identificadores enviados com frações.
spring.jackson.deserialization.accept-float-as-int=false
