name: FinIA CI

on:
  push:
    branches:
      - dev/finia-desenvolvimento
      - main
  pull_request:
    branches:
      - main
      - dev/finia-desenvolvimento

jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: banco_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/banco_app?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar backend
        run: mvn -B verify

      - name: Validar migração do banco legado
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -e \
            'DROP DATABASE IF EXISTS banco_app; CREATE DATABASE banco_app;'

          cat > /tmp/schema-legado.sql <<'SQL'
          USE banco_app;

          CREATE TABLE transacoes (
              id BIGINT PRIMARY KEY AUTO_INCREMENT,
              tipo VARCHAR(20) NOT NULL,
              valor DECIMAL(12,2) NOT NULL,
              descricao VARCHAR(120) NOT NULL,
              categoria VARCHAR(50) NOT NULL,
              data_transacao DATE NOT NULL
          );

          CREATE TABLE metas (
              id BIGINT PRIMARY KEY AUTO_INCREMENT,
              nome VARCHAR(100) NOT NULL,
              valor_alvo DECIMAL(12,2) NOT NULL,
              prazo_meses INT NOT NULL,
              valor_inicial DECIMAL(12,2) NOT NULL,
              prioridade VARCHAR(30) NOT NULL,
              descricao VARCHAR(255)
          );

          CREATE TABLE perfil_financeiro (
              id BIGINT PRIMARY KEY AUTO_INCREMENT,
              renda_mensal DECIMAL(12,2) NOT NULL,
              renda_extra DECIMAL(12,2),
              gasto_moradia DECIMAL(12,2) NOT NULL,
              gasto_agua DECIMAL(12,2) NOT NULL,
              gasto_energia DECIMAL(12,2) NOT NULL,
              gasto_internet DECIMAL(12,2) NOT NULL,
              gasto_transporte DECIMAL(12,2) NOT NULL,
              gasto_alimentacao DECIMAL(12,2) NOT NULL,
              outras_despesas DECIMAL(12,2),
              valor_planejado_guardar DECIMAL(12,2) NOT NULL,
              objetivo_principal VARCHAR(255) NOT NULL,
              saldo_atual DECIMAL(12,2) NOT NULL DEFAULT 0
          );

          CREATE TABLE revisoes_mensais (
              id BIGINT PRIMARY KEY AUTO_INCREMENT,
              mes_referencia VARCHAR(30) NOT NULL,
              gasto_inesperado BOOLEAN NOT NULL,
              valor_incorreto BOOLEAN NOT NULL,
              revisar_categorias BOOLEAN NOT NULL,
              observacoes VARCHAR(500)
          );

          INSERT INTO perfil_financeiro (
              renda_mensal, renda_extra, gasto_moradia, gasto_agua,
              gasto_energia, gasto_internet, gasto_transporte,
              gasto_alimentacao, outras_despesas, valor_planejado_guardar,
              objetivo_principal, saldo_atual
          ) VALUES (
              2500, 300, 500, 100, 150, 100, 150, 250, 50, 300,
              'Notebook', 1200
          );
          SQL

          docker run --rm --network host -i mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot < /tmp/schema-legado.sql

          docker run --rm --network host -i mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot < database/migration_v3_final.sql
          docker run --rm --network host -i mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot < database/migration_v3_final.sql

          PERFIL=$(docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -N -B -e \
            "SELECT nome, saldo_atual, renda_mensal, gastos_mensais, valor_planejado_guardar FROM banco_app.perfil_financeiro LIMIT 1")
          test "$PERFIL" = $'Usuário\t1200.00\t2500.00\t1300.00\t300.00'

          COLUNAS_ANTIGAS=$(docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -N -B -e \
            "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='banco_app' AND TABLE_NAME='perfil_financeiro' AND COLUMN_NAME IN ('renda_extra','gasto_moradia','gasto_agua','gasto_energia','gasto_internet','gasto_transporte','gasto_alimentacao','outras_despesas','objetivo_principal')")
          test "$COLUNAS_ANTIGAS" = "0"

          TABELAS_REMOVIDAS=$(docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -N -B -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='banco_app' AND TABLE_NAME IN ('transacoes','revisoes_mensais')")
          test "$TABELAS_REMOVIDAS" = "0"

      - name: Preparar schema MySQL limpo
        run: |
          docker run --rm --network host mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot -e \
            'DROP DATABASE IF EXISTS banco_app; CREATE DATABASE banco_app;'
          docker run --rm --network host -i mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot < database/schema.sql

      - name: Smoke test da API real
        shell: bash
        run: |
          set -euo pipefail

          java -jar target/finia-1.0-SNAPSHOT.jar > /tmp/finia.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for tentativa in {1..30}; do
            if curl -s -o /dev/null http://localhost:8080/perfil-financeiro; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/finia.log
            exit 1
          fi

          curl -fsS http://localhost:8080/ia/status \
            | jq -e '.configurada == false'

          STATUS_IA=$(curl -sS -o /tmp/ia-sem-chave.json -w '%{http_code}' \
            -X POST http://localhost:8080/ia/perguntar \
            -H 'Content-Type: application/json' \
            -d '{"pergunta":"Como está minha situação?"}')
          test "$STATUS_IA" = "503"
          jq -e '.erro == "IA_INDISPONIVEL"' /tmp/ia-sem-chave.json

          curl -fsS -X PUT http://localhost:8080/perfil-financeiro \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Teste CI","saldoAtual":1200}' \
            | jq -e '.nome == "Teste CI" and .saldoAtual == 1200'

          curl -fsS -X PUT http://localhost:8080/orcamento \
            -H 'Content-Type: application/json' \
            -d '{"rendaMensal":2500,"gastosMensais":1300,"valorPlanejadoGuardar":300}' \
            | jq -e '.rendaMensal == 2500 and .gastosMensais == 1300 and .margemAntesMetas == 900'

          curl -fsS -X POST http://localhost:8080/metas \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Notebook","valorAlvo":5000,"prazoMeses":10,"valorInicial":1000,"prioridade":"alta","descricao":"Meta do teste CI"}' \
            > /tmp/meta-criada.json

          jq -e '.analise.classificacao == "VIAVEL" and .meta.id > 0' /tmp/meta-criada.json
          META_ID=$(jq -r '.meta.id' /tmp/meta-criada.json)

          curl -fsS http://localhost:8080/analise/capacidade-gastos \
            | jq -e '.margemAposMetas == 500 and .capacidadeGastoImediato == 500'

          curl -fsS -X POST http://localhost:8080/analise/simular-gasto \
            -H 'Content-Type: application/json' \
            -d '{"valor":450}' \
            | jq -e '.classificacao == "ATENCAO" and .recomendado == true'

          curl -fsS -X POST http://localhost:8080/simulacoes \
            -H 'Content-Type: application/json' \
            -d '{"nomeCenario":"Teste CI","meses":3,"eventos":[{"mes":2,"tipo":"GASTO_EXTRAORDINARIO","valor":600}]}' \
            | jq -e '.saldoFinalProjetado == 2100 and .totalGastosExtraordinarios == 600 and .projecoesMetas[0].valorProjetado == 2200'

          curl -fsS http://localhost:8080/perfil-financeiro \
            | jq -e '.saldoAtual == 1200 and .rendaMensal == 2500 and .gastosMensais == 1300'

          curl -fsS "http://localhost:8080/metas/$META_ID" \
            | jq -e '.valorInicial == 1000 and .valorAlvo == 5000'

          STATUS_INVIAVEL=$(curl -sS -o /tmp/meta-inviavel.json -w '%{http_code}' \
            -X POST http://localhost:8080/metas \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Meta impossível","valorAlvo":10000,"prazoMeses":1,"valorInicial":0,"prioridade":"media"}')

          test "$STATUS_INVIAVEL" = "422"
          jq -e '.analise.classificacao == "INVIAVEL"' /tmp/meta-inviavel.json

          curl -fsS http://localhost:8080/metas \
            | jq -e 'length == 1'

          curl -fsS -X PATCH "http://localhost:8080/metas/$META_ID/progresso" \
            -H 'Content-Type: application/json' \
            -d '{"valorAtual":1500}' \
            | jq -e '.meta.valorInicial == 1500'

          curl -fsS "http://localhost:8080/metas/$META_ID/viabilidade" \
            | jq -e '.valorRestante == 3500 and .viavel == true'

          curl -fsS -X PUT http://localhost:8080/perfil-financeiro/saldo \
            -H 'Content-Type: application/json' \
            -d '{"saldoAtual":1800}' \
            | jq -e '.saldoAtual == 1800'

          STATUS_404=$(curl -sS -o /tmp/meta-nao-encontrada.json -w '%{http_code}' \
            http://localhost:8080/metas/999999)
          test "$STATUS_404" = "404"
          jq -e '.erro == "RECURSO_NAO_ENCONTRADO"' /tmp/meta-nao-encontrada.json

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Gerar build
        run: npm run build

      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium --only-shell

      - name: Testar jornadas desktop e mobile
        run: npm test

      - name: Guardar evidências de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results
